# optgen configuration file
# See: https://github.com/altessa-s/go-optgen (built into bin/ by `make generate`)
defaults:
  # Process all struct fields, not just those with opt tags
  all-fields: true

  # Default struct type name
  type: options

  # Default output file name
  output: options_gen.go

  # Format generated files with gci (import sorting), using the sections
  # .golangci.yml enforces. The command runs without a shell.
  formatter: >-
    gci write
    -s standard
    -s default
    -s "prefix(google.golang.org)"
    -s "prefix(golang.org)"
    -s "prefix(github.com/altessa-s/go-atlas-core)"
    -s "prefix(github.com/altessa-s/go-atlas-net)"
    -s "prefix(github.com/altessa-s/rmcloud-go)"
    -s "prefix(github.com/altessa-s)"
    -s blank
    -s alias
    {file}

  # Verbose output disabled by default
  verbose: false
